<style id="css">
/* Mise en page : bandeau bordeaux et or comme le logo, vitrine ivoire, panier latéral, commande par WhatsApp. */
:root{
  --marque:#600B09; --marque-fonce:#3D0605; --or:#FFBE5C; --or-texte:#9A6A1C; --or-doux:#F6E7CC;
  --bg:#FBF6EE; --surface:#FFFFFF; --ink:#2B1412; --muted:#7A625C; --line:#EADCCB;
  --ok:#2E7D4F; --ok-doux:#E3F2E8; --limite:#9A5B12; --limite-doux:#FBEBD3; --rupture:#A3261D; --rupture-doux:#F8E0DD;
  --display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:14px; color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--marque)}
.enveloppe{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--or);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.etiquette{font-size:.74rem;letter-spacing:.16em;text-transform:uppercase}

/* En-tête */
.entete{background:var(--marque);color:#FFF6EA;position:sticky;top:env(safe-area-inset-top,0px);z-index:15;border-bottom:2px solid var(--or)}
.entete .enveloppe{display:flex;align-items:center;gap:12px;padding-block:10px}
.marque{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.logo{height:64px;width:auto;max-width:min(280px,52vw);object-fit:contain;display:block}
.monogramme{width:46px;height:46px;border-radius:50%;flex:none;display:grid;place-items:center;border:1px solid var(--or);color:var(--or);font-family:var(--display);font-size:1.25rem}
.marque h1{font-size:1.3rem;line-height:1.15}
.marque p{margin:0;color:var(--or);font-size:.74rem;letter-spacing:.16em;text-transform:uppercase}
.outils{display:flex;align-items:center;gap:8px;flex:none}
.bouton-panier{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--or);background:transparent;color:#FFF6EA;border-radius:999px;padding:8px 14px;font-weight:600;font-size:.92rem}
.bouton-panier svg{width:20px;height:20px;stroke:var(--or);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.bouton-panier:hover{background:rgba(255,190,92,.12)}
.compteur{min-width:22px;height:22px;border-radius:999px;background:var(--or);color:var(--marque-fonce);font-size:.78rem;font-weight:700;display:inline-grid;place-items:center;padding:0 6px;font-variant-numeric:tabular-nums}
.bouton-gestion{border:1px solid rgba(255,246,234,.4);color:#FFF6EA;background:transparent;border-radius:999px;padding:8px 14px;font-size:.88rem}
.bouton-gestion:hover{border-color:var(--or)}
@media (max-width:560px){.logo{height:48px}.bouton-panier .libelle{display:none}.bouton-gestion{padding:8px 10px;font-size:.8rem}}

/* Ouverture */
.ouverture{background:linear-gradient(160deg,var(--marque) 0%,var(--marque-fonce) 100%);color:#FFF6EA}
.ouverture .enveloppe{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:center;padding-block:44px 48px}
.ouverture .etiquette{color:var(--or)}
.ouverture h2{font-size:clamp(2rem,5.2vw,3.4rem);line-height:1.06;margin-top:10px;max-width:15ch}
.ouverture p.texte{color:rgba(255,246,234,.82);max-width:50ch;margin:16px 0 0}
.atouts{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 0;padding:0;list-style:none}
.atouts li{border:1px solid rgba(255,190,92,.6);color:var(--or);border-radius:999px;padding:5px 12px;font-size:.85rem}
.visuel-accueil{aspect-ratio:1/1;max-width:100%;width:100%;max-height:360px;justify-self:end;display:grid;place-items:center}
.visuel-accueil img{width:100%;height:100%;object-fit:cover;border-radius:var(--r);border:1px solid rgba(255,190,92,.5)}
.visuel-accueil svg{width:78%;height:78%;stroke:var(--or);fill:none;stroke-width:1.1;stroke-linecap:round;opacity:.9}
@media (max-width:760px){.ouverture .enveloppe{grid-template-columns:1fr;padding-block:30px 34px}.visuel-accueil{max-height:230px;justify-self:center}.visuel-accueil.vide{display:none}}

/* Bandeau exemples */
.bandeau{background:var(--or-doux);color:var(--ink);font-size:.9rem;border-bottom:1px solid var(--line)}
.bandeau .enveloppe{padding-block:10px}

/* Filtres */
.titre-section{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:30px 6px}
.titre-section h2{font-size:1.8rem;color:var(--marque)}
.titre-section span{color:var(--muted);font-size:.9rem}
.filtres{display:flex;gap:8px;flex-wrap:wrap;padding-block:10px 22px}
.filtre{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-size:.92rem}
.filtre:hover{border-color:var(--or-texte)}
.filtre[aria-pressed="true"]{background:var(--marque);color:#FFF6EA;border-color:var(--marque)}

/* Grille */
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;padding-bottom:56px}
.ecrin{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.visuel{aspect-ratio:1/1;max-width:100%;background:radial-gradient(circle at 50% 42%,var(--or-doux),var(--surface) 72%);display:grid;place-items:center;position:relative}
.visuel img{width:100%;height:100%;object-fit:cover}
.visuel svg{width:46%;height:46%;stroke:var(--or-texte);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.pastille{position:absolute;top:10px;left:10px;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
.stock{position:absolute;bottom:10px;left:10px;font-size:.72rem;font-weight:700;border-radius:999px;padding:3px 10px}
.stock.en-stock{background:var(--ok-doux);color:var(--ok)}
.stock.limite{background:var(--limite-doux);color:var(--limite)}
.stock.rupture{background:var(--rupture-doux);color:var(--rupture)}
.ecrin.est-rupture .zone-fiche img,.ecrin.est-rupture .zone-fiche svg{opacity:.45}
.contenu{padding:14px 16px 16px;display:flex;flex-direction:column;gap:5px;flex:1}
.contenu h3{font-size:1.14rem;line-height:1.25}
.details{color:var(--muted);font-size:.86rem}
.prix{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.08rem;margin-top:auto;padding-top:8px;color:var(--marque)}
.ajouter{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--marque);color:#FFF6EA;border:none;border-radius:10px;padding:11px 14px;font-weight:600;font-size:.92rem;margin-top:8px}
.ajouter:hover{background:var(--marque-fonce)}
.ajouter:disabled{background:var(--line);color:var(--muted);cursor:default}
.lien-wa{font-size:.82rem;color:var(--or-texte);text-align:center;text-decoration:underline;text-underline-offset:3px}
.vide{padding:40px 0;color:var(--muted)}

/* Contact */
.contact{background:var(--marque);color:#FFF6EA;border-top:2px solid var(--or)}
.contact .enveloppe{padding-block:40px;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:28px}
.contact h2{font-size:1.7rem}
.contact p{color:rgba(255,246,234,.8);margin:10px 0 0}
.contact dl{margin:0;display:grid;gap:14px}
.contact dt{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:var(--or)}
.contact dd{margin:2px 0 0;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.contact a{color:#FFF6EA}
.pied{background:var(--marque-fonce);color:rgba(255,246,234,.7);font-size:.84rem}
.pied .enveloppe{padding-block:16px}

/* Panier */
.voile{position:fixed;inset:0;background:rgba(43,20,18,.45);z-index:40}
.panier{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:-12px 0 32px -18px rgba(0,0,0,.4);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.panier-tete{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px;background:var(--marque);color:#FFF6EA;border-bottom:2px solid var(--or)}
.panier-tete h2{font-size:1.35rem}
.fermer{border:1px solid rgba(255,246,234,.4);background:transparent;color:#FFF6EA;border-radius:999px;width:36px;height:36px;font-size:1.1rem;line-height:1}
.panier-corps{flex:1;overflow-y:auto;padding:16px 18px;display:grid;gap:12px;align-content:start}
.panier-pied{border-top:1px solid var(--line);padding:14px 18px;display:grid;gap:10px;background:var(--surface)}
.article{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.article .mini{width:56px;height:56px;border-radius:8px;background:var(--or-doux);display:grid;place-items:center;overflow:hidden}
.article .mini img{width:100%;height:100%;object-fit:cover}
.article .mini svg{width:60%;height:60%;stroke:var(--or-texte);fill:none;stroke-width:1.6}
.article strong{display:block;font-weight:600;font-size:.95rem;overflow-wrap:anywhere}
.article span{color:var(--muted);font-size:.84rem;font-variant-numeric:tabular-nums}
.quantite{display:flex;align-items:center;gap:6px}
.quantite button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700}
.quantite output{min-width:20px;text-align:center;font-variant-numeric:tabular-nums}
.retirer{border:none;background:none;color:var(--rupture);font-size:.8rem;text-decoration:underline;padding:0;justify-self:start}
.ligne-total{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums}
.ligne-total.grand{font-weight:700;font-size:1.1rem;color:var(--marque)}
.btn-principal{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--marque);color:#FFF6EA;border:none;border-radius:10px;padding:13px 16px;font-weight:700;text-decoration:none;font-size:.98rem;width:100%}
.btn-principal:hover{background:var(--marque-fonce)}
.btn-wa{background:#1F7A45}
.btn-wa:hover{background:#17603A}
.btn-second{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 16px;font-weight:600;width:100%}
.formulaire{display:grid;gap:12px}
.formulaire fieldset{border:1px solid var(--line);border-radius:12px;padding:12px;margin:0;display:grid;gap:8px;background:var(--surface)}
.formulaire legend{font-weight:700;font-size:.9rem;padding:0 4px}
.choix{display:flex;gap:10px;align-items:flex-start;font-size:.93rem}
.choix input{margin-top:4px;accent-color:var(--marque)}
.choix small{display:block;color:var(--muted);font-size:.8rem}
.champ{display:grid;gap:5px;min-width:0}
.champ label{font-size:.85rem;font-weight:600}
.champ small{color:var(--muted);font-size:.8rem}
.champ input,.champ select,.champ textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px}
.erreur{color:var(--rupture);font-size:.86rem}
.recap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;font-size:.93rem}
.consigne{background:var(--or-doux);border-radius:12px;padding:14px;font-size:.92rem;display:grid;gap:6px}
.consigne strong{color:var(--marque)}
.numero{font-variant-numeric:tabular-nums;font-weight:700;user-select:all}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#FFF6EA;padding:10px 18px;border-radius:999px;font-size:.92rem;z-index:50;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}

/* Gestion */
.gestion{position:fixed;inset:0;background:var(--bg);z-index:60;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.gestion .enveloppe{padding-block:20px 60px;max-width:860px}
.barre-gestion{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.barre-gestion h2{font-size:1.5rem;color:var(--marque)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:600;font-size:.92rem}
.btn.principal{background:var(--marque);color:#FFF6EA;border-color:var(--marque)}
.btn.danger{color:var(--rupture)}
.btn:disabled{opacity:.55;cursor:default}
.onglets{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.onglet{border:none;background:transparent;padding:8px 14px;border-radius:8px;color:var(--muted);font-weight:600}
.onglet[aria-selected="true"]{background:var(--surface);color:var(--marque);border:1px solid var(--line)}
.champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.champ.large{grid-column:1/-1}
.champ input[type=color]{padding:3px;height:42px}
.case{display:flex;gap:8px;align-items:center;font-size:.92rem}
.case input{accent-color:var(--marque)}
.sous-titre{font-family:var(--display);font-size:1.15rem;margin:22px 0 10px;color:var(--marque)}
.ligne-logo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.apercu-logo{background:var(--marque);border-radius:10px;padding:6px 10px;display:inline-block}
.liste-produits{display:grid;gap:10px}
.ligne-produit{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;flex-wrap:wrap}
.ligne-produit .mini{width:44px;height:44px;border-radius:8px;flex:none;background:var(--or-doux);display:grid;place-items:center;overflow:hidden}
.ligne-produit .mini img{width:100%;height:100%;object-fit:cover}
.ligne-produit .mini svg{width:60%;height:60%;stroke:var(--or-texte);fill:none;stroke-width:1.6}
.ligne-produit .infos{flex:1;min-width:160px}
.ligne-produit .infos strong{display:block;overflow-wrap:anywhere}
.ligne-produit .infos span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.marque-exemple{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;color:var(--limite);border:1px solid currentColor;border-radius:999px;padding:1px 7px;margin-left:6px}
.editeur{background:var(--surface);border:1px solid var(--or-texte);border-radius:14px;padding:16px;margin-bottom:16px;display:grid;gap:14px}
.message{font-size:.9rem;padding:10px 12px;border-radius:10px;background:var(--or-doux)}
.message.erreur{color:var(--rupture)}
.confirmer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}

@media (max-width:720px){
  .grille{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
  .contenu{padding:12px}
  .contenu h3{font-size:1rem}
  .ajouter{padding:10px 8px;font-size:.86rem}
}
/* ---------- Modernisation : profondeur, reflets dorés, animations légères ---------- */
:root{--ease:cubic-bezier(.22,1,.36,1);--ease-ressort:cubic-bezier(.34,1.56,.64,1);--ombre-1:0 1px 2px rgba(61,6,5,.05),0 4px 14px -8px rgba(61,6,5,.16);--ombre-2:0 22px 44px -24px rgba(61,6,5,.5)}
html{scroll-behavior:smooth}
#bijoux{scroll-margin-top:96px}

/* En-tête : reflet doré qui glisse, ombre au défilement */
.entete{transition:box-shadow .35s var(--ease)}
.entete::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;pointer-events:none;background:linear-gradient(90deg,transparent,#FFF3D6,transparent) no-repeat;background-size:35% 100%;animation:reflet 7s var(--ease) infinite}
.entete.defile{box-shadow:0 12px 30px -16px rgba(0,0,0,.6)}
.logo{transition:height .35s var(--ease)}
.entete.defile .logo{height:52px}
@media (max-width:560px){.entete.defile .logo{height:42px}}
.bouton-panier{transition:background-color .25s,transform .25s var(--ease)}
.bouton-panier:active{transform:scale(.96)}
.compteur.saute{animation:saute .55s var(--ease-ressort)}

/* Ouverture : halos dorés, titre scintillant, entrée en cascade */
.ouverture{position:relative;overflow:hidden;isolation:isolate}
.ouverture::before,.ouverture::after{content:"";position:absolute;border-radius:50%;z-index:-1;pointer-events:none}
.ouverture::before{width:640px;height:640px;right:-200px;top:-260px;background:radial-gradient(circle,rgba(255,190,92,.30),transparent 62%);animation:flotte 16s ease-in-out infinite alternate}
.ouverture::after{width:520px;height:520px;left:-220px;bottom:-280px;background:radial-gradient(circle,rgba(255,150,110,.16),transparent 62%);animation:flotte 20s ease-in-out infinite alternate-reverse}
@media (min-width:761px){.ouverture .enveloppe{padding-block:68px 76px}}
@supports ((-webkit-background-clip:text) or (background-clip:text)){
  .ouverture h2{background:linear-gradient(100deg,#FFF6EA 0%,#FFF6EA 38%,var(--or) 50%,#FFF6EA 62%,#FFF6EA 100%);background-size:260% 100%;background-position:100% 0;-webkit-background-clip:text;background-clip:text;color:transparent}
  .ouverture .enveloppe>div:first-child>h2{animation:monte .9s var(--ease) .08s both,scintille 9s linear 1.4s infinite}
}
.ouverture .enveloppe>div:first-child>*{animation:monte .9s var(--ease) both}
.ouverture .enveloppe>div:first-child>:nth-child(2){animation-delay:.08s}
.ouverture .enveloppe>div:first-child>:nth-child(3){animation-delay:.16s}
.ouverture .enveloppe>div:first-child>:nth-child(4){animation-delay:.24s}
.ouverture .enveloppe>div:first-child>:nth-child(5){animation-delay:.32s}
.atouts li{background:rgba(255,190,92,.06);backdrop-filter:blur(4px)}
.visuel-accueil{animation:apparait 1.2s var(--ease) .2s both}
.visuel-accueil svg{animation:levite 7s ease-in-out infinite}
.visuel-accueil svg *{stroke-dasharray:420;stroke-dashoffset:420;animation:trace 2.6s var(--ease) forwards}
.visuel-accueil svg :nth-child(2){animation-delay:.25s}
.visuel-accueil svg :nth-child(3){animation-delay:.5s}
.visuel-accueil svg :nth-child(4),.visuel-accueil svg :nth-child(5){animation-delay:.7s}
.visuel-accueil svg :nth-child(n+6){animation-delay:1s}
.visuel-accueil img{box-shadow:0 34px 60px -30px rgba(0,0,0,.7);animation:levite 8s ease-in-out infinite}
.appels{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.cta{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;border-radius:999px;padding:12px 22px;font-weight:700;font-size:.96rem;text-decoration:none;transition:transform .3s var(--ease),box-shadow .3s var(--ease),background-color .25s,border-color .25s}
.cta svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cta.or{background:var(--or);color:var(--marque-fonce);box-shadow:0 12px 26px -14px rgba(255,190,92,.9)}
.cta.or:hover{transform:translateY(-2px);box-shadow:0 18px 32px -14px rgba(255,190,92,1)}
.cta.contour{border:1px solid rgba(255,246,234,.45);color:#FFF6EA}
.cta.contour:hover{border-color:var(--or);background:rgba(255,190,92,.1)}
.cta:active{transform:scale(.97)}

/* Comment commander */
.etapes{background:var(--surface);border-bottom:1px solid var(--line)}
.etapes ol{list-style:none;margin:0;padding:20px 0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;counter-reset:e}
.etapes li{display:flex;gap:12px;align-items:center;font-size:.9rem;color:var(--muted);counter-increment:e;min-width:0}
.etapes li::before{content:counter(e);flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:1.1rem;color:var(--marque);border:1px solid rgba(154,106,28,.5);background:radial-gradient(circle at 35% 30%,#fff,var(--or-doux))}
.etapes strong{display:block;color:var(--ink);font-weight:600;font-size:.95rem}
@media (max-width:720px){.etapes ol{grid-template-columns:1fr;gap:12px;padding:16px 0}}

/* Titres et filtres */
.titre-section h2::after{content:"";display:block;width:56px;height:2px;margin-top:10px;background:linear-gradient(90deg,var(--or-texte),var(--or),transparent)}
.filtre{transition:background-color .25s,color .25s,border-color .25s,transform .2s var(--ease)}
.filtre:active{transform:scale(.95)}
.filtre[aria-pressed="true"]{box-shadow:0 8px 18px -10px rgba(96,11,9,.7)}
@media (max-width:720px){
  .filtres{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px;scroll-snap-type:x proximity;scroll-padding-inline:16px}
  .filtres::-webkit-scrollbar{display:none}
  .filtre{flex:none;scroll-snap-align:start}
}

/* Écrins : relief, zoom doux et reflet au survol */
.ecrin{box-shadow:var(--ombre-1);transition:transform .5s var(--ease),box-shadow .5s var(--ease),border-color .3s}
.visuel{overflow:hidden}
.zone-fiche img,.zone-fiche svg{transition:transform .8s var(--ease)}
.visuel::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.5) 50%,transparent 65%);transform:translateX(-130%)}
.pastille,.stock{z-index:2}
.pastille{background:rgba(255,255,255,.86);backdrop-filter:blur(6px)}
.prix{font-family:var(--display);font-weight:400;font-size:1.22rem;letter-spacing:.01em}
.ajouter{transition:background-color .25s,transform .2s var(--ease)}
.ajouter:active:not(:disabled){transform:scale(.96)}
.ajouter.fait,.ajouter.fait:hover{background:var(--ok)}
.lien-wa{transition:color .2s}
.lien-wa:hover{color:var(--marque)}
@media (hover:hover) and (prefers-reduced-motion:no-preference){
  .ecrin:hover,.js-anim .ecrin.pret:hover{transform:translateY(-6px);box-shadow:var(--ombre-2);border-color:rgba(154,106,28,.45)}
  .ecrin:hover .zone-fiche img{transform:scale(1.06)}
  .ecrin:hover .zone-fiche svg{transform:scale(1.1) rotate(-4deg)}
  .ecrin:hover .visuel::after{transform:translateX(130%);transition:transform 1s var(--ease)}
}
.js-anim .ecrin{opacity:0}
.js-anim .ecrin.vu{animation:monte .75s var(--ease) var(--d,0s) both}
.js-anim .ecrin.pret{opacity:1;animation:none}

/* Contact, panier, toast */
.contact{position:relative;overflow:hidden;isolation:isolate}
.contact::before{content:"";position:absolute;z-index:-1;width:560px;height:560px;right:-180px;bottom:-320px;border-radius:50%;background:radial-gradient(circle,rgba(255,190,92,.22),transparent 62%);pointer-events:none}
.voile:not([hidden]){animation:fondu .3s ease both;backdrop-filter:blur(2px)}
.panier:not([hidden]){animation:glisse .45s var(--ease) both}
.gestion:not([hidden]){animation:fondu .25s ease both}
.article{animation:monte .4s var(--ease) both}
.btn-principal,.btn-second{transition:background-color .25s,transform .2s var(--ease)}
.btn-principal:active,.btn-second:active{transform:scale(.98)}
.toast{background:rgba(43,20,18,.92);backdrop-filter:blur(8px);border:1px solid rgba(255,190,92,.35);max-width:calc(100% - 32px);text-align:center}
.toast:not([hidden]){animation:toast .45s var(--ease-ressort) both}

/* Bouton WhatsApp flottant */
.wa-flottant{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;width:56px;height:56px;border-radius:50%;background:#1F7A45;color:#fff;display:grid;place-items:center;box-shadow:0 14px 28px -12px rgba(0,0,0,.55);transition:transform .35s var(--ease-ressort)}
.wa-flottant svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.wa-flottant::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #1F7A45;animation:onde 3s var(--ease) infinite}
.wa-flottant:hover{transform:scale(1.08)}
.wa-flottant:active{transform:scale(.94)}
@media (max-width:720px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}.pied .enveloppe{padding-right:84px}}

/* Club Kadya */
.annonce{background:var(--marque-fonce);color:var(--or);font-size:.84rem;text-align:center;letter-spacing:.02em}
.annonce a{display:block;padding:8px 16px;color:inherit;text-decoration:none}
.annonce a:hover{text-decoration:underline;text-underline-offset:3px}
.club{padding-bottom:64px;scroll-margin-top:96px}
.club-grille{position:relative;overflow:hidden;isolation:isolate;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:32px;align-items:center;background:linear-gradient(135deg,#FFFFFF 0%,var(--or-doux) 100%);border:1px solid rgba(154,106,28,.35);border-radius:22px;padding:40px;box-shadow:var(--ombre-1)}
.club-grille::after{content:attr(data-pct);position:absolute;z-index:-1;right:-12px;top:-40px;font-family:var(--display);font-size:clamp(7rem,16vw,12rem);line-height:1;color:rgba(154,106,28,.08);pointer-events:none;white-space:nowrap}
.club .etiquette{color:var(--or-texte)}
.club h2{font-size:clamp(1.8rem,4vw,2.6rem);line-height:1.1;color:var(--marque);margin-top:8px}
.club-texte>p:not(.etiquette){color:var(--muted);margin:12px 0 0;max-width:46ch}
.avantages{list-style:none;padding:0;margin:18px 0 0;display:grid;gap:8px}
.avantages li{display:flex;gap:10px;align-items:center;font-size:.95rem}
.avantages li::before{content:"✦";color:var(--or-texte)}
.club-carte{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--ombre-2);min-width:0}
.club-carte form{display:grid;gap:12px}
.club-carte .choix{font-size:.84rem;color:var(--muted)}
.club-merci{display:grid;gap:10px;animation:monte .5s var(--ease) both}
.club-merci .bienvenue{font-family:var(--display);font-size:1.35rem;color:var(--marque);margin:0}
.club-merci p{margin:0}
.code-promo{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px dashed var(--or-texte);border-radius:12px;padding:12px 14px;background:var(--or-doux)}
.code-promo .numero{font-size:clamp(1.05rem,4.6vw,1.3rem);letter-spacing:.06em;color:var(--marque);white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
.copier{border:1px solid var(--or-texte);background:var(--surface);color:var(--marque);border-radius:999px;padding:7px 14px;font-weight:600;font-size:.86rem;flex:none}
.ligne-total.remise{color:var(--ok);font-weight:600}
.indice{font-size:.82rem;color:var(--muted)}
.indice.ok{color:var(--ok)}
@media (max-width:760px){.club-grille{grid-template-columns:1fr;gap:22px;padding:26px 18px}}

/* ---------- Menu latéral ---------- */
.bouton-menu{flex:none;width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,246,234,.35);background:transparent;color:#FFF6EA;display:grid;place-items:center;transition:border-color .25s,background-color .25s}
.bouton-menu:hover{border-color:var(--or);background:rgba(255,190,92,.1)}
.bouton-menu svg{width:22px;height:22px;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;fill:none}
.voile-menu{position:fixed;inset:0;background:rgba(43,20,18,.45);z-index:40}
.voile-menu:not([hidden]){animation:fondu .3s ease both;backdrop-filter:blur(2px)}
.menu{position:fixed;top:0;left:0;bottom:0;width:min(340px,88vw);background:var(--bg);z-index:41;display:flex;flex-direction:column;box-shadow:12px 0 32px -18px rgba(0,0,0,.4);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px)}
.menu:not([hidden]){animation:glisse-g .45s var(--ease) both}
.menu-tete{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;background:var(--marque);border-bottom:2px solid var(--or);color:#FFF6EA}
.menu-tete .logo{height:44px}
.menu-corps{flex:1;overflow-y:auto;padding:14px 12px 24px}
.menu-titre{font-size:.7rem;letter-spacing:.16em;text-transform:uppercase;color:var(--or-texte);margin:18px 10px 6px}
.menu-lien{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;text-align:left;border:none;background:none;padding:11px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-size:.98rem;transition:background-color .2s,padding-left .25s var(--ease)}
.menu-lien:hover{background:var(--surface);padding-left:14px}
.menu-lien.actif{background:var(--surface);color:var(--marque);font-weight:600;box-shadow:inset 3px 0 0 var(--or-texte)}
.menu-lien span{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
.menu-pied{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
.menu-pied a{font-size:.88rem;color:var(--marque);font-weight:600}

/* ---------- Recherche et tri ---------- */
.recherche{position:relative;flex:1;min-width:0}
.recherche svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.recherche input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 14px 11px 38px;min-height:44px;transition:border-color .2s,box-shadow .2s}
.recherche input:focus{outline:none;border-color:var(--or-texte);box-shadow:0 0 0 3px rgba(255,190,92,.3)}
.barre-outils{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding-bottom:4px}
.tri{display:flex;align-items:center;gap:8px;font-size:.88rem;color:var(--muted)}
.tri select{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 12px;min-height:44px;color:var(--ink)}
@media (max-width:560px){.barre-outils .recherche{flex-basis:100%}.tri{flex:1}.tri select{flex:1}}

/* ---------- Écrins : favoris, badges, prix barré ---------- */
.zone-fiche{position:absolute;inset:0;display:grid;place-items:center}
.zone-fiche img{width:100%;height:100%;object-fit:cover}
.contenu h3 a{color:inherit;text-decoration:none}
.contenu h3 a:hover{color:var(--marque)}
.coeur{position:absolute;top:8px;right:8px;z-index:3;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.88);backdrop-filter:blur(6px);display:grid;place-items:center;transition:transform .3s var(--ease-ressort)}
.coeur svg{width:19px;height:19px;stroke:var(--marque);stroke-width:1.8;fill:none;transition:fill .2s}
.coeur[aria-pressed="true"] svg{fill:var(--marque)}
.coeur:active{transform:scale(.85)}
.coeur.bat{animation:bat .45s var(--ease-ressort)}
.badges{position:absolute;top:40px;left:10px;z-index:2;display:grid;gap:4px;justify-items:start}
.badge{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px}
.badge.promo{background:var(--marque);color:#FFF6EA}
.badge.nouveau{background:var(--or);color:var(--marque-fonce)}
.prix s{color:var(--muted);font-family:var(--body);font-size:.85rem;font-weight:400;margin-right:6px}
.prix.en-promo{color:var(--rupture)}
.ecrin .prix s{display:block;margin:0 0 2px;white-space:nowrap}

/* ---------- Fiche bijou ---------- */
.fiche{position:fixed;inset:0;z-index:45;background:rgba(43,20,18,.55);display:grid;place-items:center;padding:24px}
.fiche:not([hidden]){animation:fondu .25s ease both;backdrop-filter:blur(3px)}
.fiche-boite{position:relative;background:var(--bg);border-radius:20px;width:min(1000px,100%);max-height:100%;overflow-y:auto;box-shadow:0 30px 80px -30px rgba(0,0,0,.6);animation:monte .45s var(--ease) both}
.fiche-fermer{position:sticky;top:12px;float:right;margin:12px 12px 0 0;z-index:5;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:1.1rem;box-shadow:var(--ombre-1)}
.fiche-grille{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;padding:24px}
.galerie{display:grid;gap:10px;min-width:0}
.fiche-image{position:relative;aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:radial-gradient(circle at 50% 42%,var(--or-doux),var(--surface) 72%);display:grid;place-items:center;cursor:zoom-in;border:1px solid var(--line)}
.fiche-image img{width:100%;height:100%;object-fit:cover;transition:transform .35s var(--ease);transform-origin:var(--x,50%) var(--y,50%)}
.fiche-image svg{width:45%;height:45%;stroke:var(--or-texte);fill:none;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.fiche-image.zoome{cursor:zoom-out}
.fiche-image.zoome img{transform:scale(2.2)}
.miniatures{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.miniatures button{flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--or-doux)}
.miniatures button[aria-pressed="true"]{border-color:var(--or-texte)}
.miniatures img{width:100%;height:100%;object-fit:cover}
.fiche-infos{display:grid;gap:12px;align-content:start;min-width:0;padding-top:8px}
.fiche-infos .pastille,.fiche-infos .stock{position:static;display:inline-block}
.fiche-etiquettes{display:flex;gap:6px;flex-wrap:wrap}
.fiche-infos h2{font-size:clamp(1.6rem,3.4vw,2.2rem);line-height:1.1;color:var(--ink)}
.fiche-infos .prix{font-size:1.6rem;margin:0;padding:0}
.fiche-infos .prix s{font-size:1rem}
.fiche-infos p{margin:0;color:var(--muted)}
.fiche-actions{display:grid;grid-template-columns:1fr auto auto;gap:8px}
.fiche-actions .ajouter{margin:0;padding:14px}
.icone-btn{width:50px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.icone-btn svg{width:21px;height:21px;stroke:var(--marque);stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.icone-btn[aria-pressed="true"] svg{fill:var(--marque)}
.encart{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:4px;font-size:.92rem}
.encart strong{color:var(--marque);font-weight:600}
.encart a{color:var(--or-texte);font-weight:600}
.suggestions{padding:0 24px 26px;clear:both}
.suggestions h3{font-size:1.35rem;color:var(--marque);margin-bottom:12px}
.suggestions .liste-sugg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.sugg{border:1px solid var(--line);background:var(--surface);border-radius:12px;overflow:hidden;text-align:left;padding:0;display:grid;transition:transform .3s var(--ease),box-shadow .3s}
.sugg:hover{transform:translateY(-3px);box-shadow:var(--ombre-1)}
.sugg .mini{aspect-ratio:1/1;display:grid;place-items:center;background:radial-gradient(circle at 50% 42%,var(--or-doux),var(--surface) 72%)}
.sugg .mini img{width:100%;height:100%;object-fit:cover}
.sugg .mini svg{width:42%;height:42%;stroke:var(--or-texte);fill:none;stroke-width:1.4}
.sugg span{padding:8px 10px 0;font-size:.88rem;font-weight:600;overflow-wrap:anywhere}
.sugg small{padding:2px 10px 10px;color:var(--marque);font-family:var(--display);font-size:.98rem}
@media (max-width:760px){
  .fiche{padding:0;place-items:end stretch}
  .fiche-boite{border-radius:20px 20px 0 0;max-height:94vh;max-height:94dvh}
  .fiche-grille{grid-template-columns:1fr;gap:16px;padding:14px 16px}
  .suggestions{padding:0 16px 24px}
  .suggestions .liste-sugg{grid-template-columns:repeat(2,minmax(0,1fr))}
}

/* ---------- Livraison offerte ---------- */
.offerte{display:grid;gap:6px;font-size:.88rem}
.offerte .jauge{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.offerte .jauge i{display:block;height:100%;background:linear-gradient(90deg,var(--or-texte),var(--or));border-radius:inherit;transition:width .6s var(--ease)}
.offerte.atteinte{color:var(--ok);font-weight:600}

/* ---------- Avis ---------- */
.avis{padding-bottom:56px}
.avis .titre-section{padding-top:0}
.liste-avis{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.carte-avis{margin:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:10px;box-shadow:var(--ombre-1)}
.etoiles{color:var(--or-texte);letter-spacing:2px;font-size:1rem}
.carte-avis blockquote{margin:0;font-size:.98rem}
.carte-avis cite{font-style:normal;color:var(--muted);font-size:.86rem}

/* ---------- Aide : guide des tailles et FAQ ---------- */
.aide{background:var(--surface);border-top:1px solid var(--line)}
.aide .enveloppe{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;padding-block:48px}
.aide h2{font-size:1.7rem;color:var(--marque);scroll-margin-top:96px}
.aide h2::after{content:"";display:block;width:56px;height:2px;margin-top:10px;background:linear-gradient(90deg,var(--or-texte),var(--or),transparent)}
.aide ol{margin:16px 0;padding-left:20px;display:grid;gap:6px;color:var(--ink)}
.tableau-tailles{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums;margin-top:6px}
.tableau-tailles th,.tableau-tailles td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left}
.tableau-tailles th{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.tableau-tailles tr:hover td{background:var(--bg)}
.astuce{background:var(--or-doux);border-radius:12px;padding:12px 14px;font-size:.9rem;margin-top:14px}
.faq{display:grid;gap:8px;margin-top:16px}
.faq details{border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.faq summary{cursor:pointer;list-style:none;padding:14px 44px 14px 16px;font-weight:600;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:1.3rem;color:var(--or-texte);transition:transform .3s var(--ease)}
.faq details[open] summary::after{transform:translateY(-50%) rotate(45deg)}
.faq details p{margin:0;padding:0 16px 14px;color:var(--muted);white-space:pre-line}
.faq details[open] p{animation:monte .35s var(--ease) both}
@media (max-width:760px){.aide .enveloppe{grid-template-columns:1fr;gap:36px;padding-block:36px}}

/* ---------- Gestion : avis et photos ---------- */
.photos-sup{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.photos-sup .vignette{position:relative;width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--or-doux)}
.photos-sup .vignette img{width:100%;height:100%;object-fit:cover}
.photos-sup .vignette button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:none;background:rgba(0,0,0,.6);color:#fff;font-size:.75rem;line-height:1}
.ligne-avis{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ligne-avis p{margin:2px 0 0;color:var(--muted);font-size:.88rem}

@keyframes glisse-g{from{transform:translateX(-100%)}}
@keyframes bat{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}

    var json = JSON.stringify(s).replace(/</g, "\\u003c");
    var fin = "</" + "script>";
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
      '<title>' + esc(s.nom || "Bijouterie") + '</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' + POLICES + '\n' +
      '<style id="css">' + document.getElementById("css").textContent + '</style>\n\n<div id="app"></div>\n\n' +
      '<template id="gabarit">' + document.getElementById("gabarit").innerHTML + '</template>\n\n' +
      '<script type="application/json" id="donnees">' + json + fin + '\n\n<script id="appli">' + SOURCE + fin + '\n</body></html>';
  }

  async function enregistrer(){
    if (enEdition) { message("Validez ou annulez le bijou en cours de modification avant d'enregistrer.", true); return; }
    if (!artifact) { message("L'enregistrement n'est pas disponible dans cette vue.", true); return; }
    var s = nettoyer(brouillon);
    if (s.whatsapp && chiffres(s.whatsapp).length < 8) { message("Le numéro WhatsApp semble incomplet. Indiquez-le avec l'indicatif, par exemple +224 6XX XX XX XX.", true); afficherOnglet("boutique"); return; }
    var btn = $("enregistrer"); btn.disabled = true; btn.textContent = "Publication…";
    try { await artifact.publish(documentComplet(s)); message("Publié. La page se recharge avec vos changements."); }
    catch (err) {
      btn.disabled = false; btn.textContent = "Enregistrer et publier";
      var code = err && err.code;
      if (code === "conflict") message("Quelqu'un d'autre vient de publier une modification : la page se recharge avec sa version.", true);
      else if (code === "not_writer" || code === "not_granted") { message("Vous pouvez consulter la boutique, mais pas la modifier.", true); $("ouvrir-gestion").hidden = true; }
      else if (code === "too_large") message("La page est trop lourde. Retirez quelques photos et réessayez.", true);
      else if (code === "rate_limited") message("Trop d'enregistrements rapprochés. Patientez une minute puis réessayez.", true);
      else message("La publication a échoué. Réessayez dans un instant.", true);
    }
  }

  rendreVitrine();
  (function(){ var m = /^#bijou-(.+)$/.exec(location.hash); if (m) ouvrirFiche(decodeURIComponent(m[1]), null); })();
  var entete = app.querySelector(".entete");
  function ombreEntete(){ entete.classList.toggle("defile", window.scrollY > 8); }
  window.addEventListener("scroll", ombreEntete, {passive: true}); ombreEntete();

  (async function(){
    if (!window.claude || !window.claude.use) return;
    try {
      var res = await Promise.all([claude.use("artifact"), claude.use("user"), claude.use("assets")]);
      artifact = res[0]; assets = res[2];
      var u = res[1];
      $("ouvrir-gestion").hidden = !(artifact && u && (await u.canEdit()));
    } catch (e) { /* vitrine seule */ }
  })();
})();
</script>
