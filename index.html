<style id="css">
/* Mise en page : vitrine claire — en-tête sobre, cours du gramme, filtres, grille d'écrins, contact. */
:root{
  --bg:#F6F4F1; --surface:#FFFFFF; --ink:#2A2420; --muted:#776D64;
  --gold:#9C7630; --gold-soft:#F1E7D2; --line:#E5DFD6; --marque:#600B09; --marque-texte:#FFF6EA; --marque-or:#FFBE5C; --ok:#2F7A4F; --warn:#9A5B12; --danger:#A33A2C;
  --display:"Marcellus","Cormorant Garamond",Georgia,serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15120F; --surface:#1F1A16; --ink:#F0E9DF; --muted:#AA9F92; --gold:#D6B36C; --gold-soft:#372C1C; --line:#342B23; --marque:#600B09; --marque-texte:#FFF6EA; --marque-or:#FFBE5C; --ok:#6FC492; --warn:#E3A55A; --danger:#E5826F; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15120F; --surface:#1F1A16; --ink:#F0E9DF; --muted:#AA9F92; --gold:#D6B36C; --gold-soft:#372C1C; --line:#342B23; --marque:#600B09; --marque-texte:#FFF6EA; --marque-or:#FFBE5C; --ok:#6FC492; --warn:#E3A55A; --danger:#E5826F; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55}
.enveloppe{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.etiquette{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* En-tête */
.entete{background:var(--marque);color:var(--marque-texte)}
.entete .enveloppe{display:flex;align-items:center;gap:16px;padding-block:14px;flex-wrap:wrap}
.marque{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.logo{height:80px;width:auto;max-width:min(320px,58vw);object-fit:contain;flex:none;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.apercu-logo{background:var(--marque);border-radius:10px;padding:6px 10px;display:inline-block}
.monogramme{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;border:1px solid var(--marque-or);color:var(--marque-or);font-family:var(--display);font-size:1.25rem}
.marque h1{font-size:1.35rem;line-height:1.2}
.marque p{margin:0;color:var(--marque-or);font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}
.bouton-gestion{border:1px solid rgba(255,246,234,.45);color:var(--marque-texte);background:transparent;border-radius:999px;padding:8px 16px;font-size:.9rem}
.bouton-gestion:hover{border-color:var(--marque-or)}

/* Bandeau exemples */
.photo-accueil{max-width:1120px;margin:20px auto 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.photo-accueil img{width:100%;max-width:100%;aspect-ratio:16/6;object-fit:cover;border-radius:var(--r);display:block}
@media (max-width:720px){.photo-accueil img{aspect-ratio:4/3}}
.bandeau{background:var(--gold-soft);color:var(--ink);font-size:.9rem}
.bandeau .enveloppe{padding-block:10px}

/* Ouverture */
.ouverture{padding-block:40px 24px;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:32px;align-items:end}
.ouverture h2{font-size:clamp(2rem,5vw,3.2rem);line-height:1.08;max-width:16ch}
.ouverture p{color:var(--muted);max-width:52ch;margin:14px 0 0}
.cours{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;display:grid;gap:4px}
.cours strong{font-family:var(--display);font-weight:400;font-size:1.9rem;font-variant-numeric:tabular-nums;color:var(--gold)}
.cours small{color:var(--muted)}

/* Filtres */
.filtres{display:flex;gap:8px;flex-wrap:wrap;padding-block:8px 20px}
.filtre{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 15px;font-size:.92rem}
.filtre[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Grille */
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px;padding-bottom:48px}
.ecrin{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;min-width:0}
.visuel{aspect-ratio:1/1;max-width:100%;background:radial-gradient(circle at 50% 42%,var(--gold-soft),var(--surface) 72%);display:grid;place-items:center;position:relative}
.visuel img{width:100%;height:100%;object-fit:cover}
.visuel svg{width:46%;height:46%;stroke:var(--gold);fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.pastille{position:absolute;top:10px;left:10px;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--muted)}
.contenu{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.contenu h3{font-size:1.15rem;line-height:1.25}
.details{color:var(--muted);font-size:.88rem}
.prix{font-weight:700;font-variant-numeric:tabular-nums;font-size:1.05rem;margin-top:auto;padding-top:6px}
.prix.epuise{color:var(--muted);font-weight:500}
.commander{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--marque);color:var(--marque-texte);border-radius:10px;padding:10px 14px;text-decoration:none;font-weight:600;font-size:.92rem;margin-top:8px}
.commander:hover{background:var(--gold)}
.commander[aria-disabled="true"]{background:var(--line);color:var(--muted);pointer-events:none}
.vide{padding:40px 0;color:var(--muted)}

/* Contact */
.contact{border-top:1px solid var(--line);background:var(--surface)}
.contact .enveloppe{padding-block:36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px}
.contact h2{font-size:1.6rem}
.contact dl{margin:0;display:grid;gap:12px}
.contact dt{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.contact dd{margin:2px 0 0;font-variant-numeric:tabular-nums}
.contact a{color:var(--gold)}
.pied{color:var(--muted);font-size:.85rem}
.pied .enveloppe{padding-block:18px}

/* Gestion */
.gestion{position:fixed;inset:0;background:var(--bg);z-index:20;overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.gestion .enveloppe{padding-block:20px 60px;max-width:820px}
.barre-gestion{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between;padding-bottom:14px;border-bottom:1px solid var(--line);margin-bottom:18px}
.barre-gestion h2{font-size:1.5rem}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 16px;font-weight:600;font-size:.92rem}
.btn.principal{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.55;cursor:default}
.onglets{display:flex;gap:6px;margin-bottom:18px}
.onglet{border:none;background:transparent;padding:8px 14px;border-radius:8px;color:var(--muted);font-weight:600}
.onglet[aria-selected="true"]{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.champ{display:grid;gap:5px;min-width:0}
.champ label{font-size:.85rem;font-weight:600}
.champ small{color:var(--muted);font-size:.8rem}
.champ input,.champ select,.champ textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
.champ.large{grid-column:1/-1}
.ligne-logo{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.liste-produits{display:grid;gap:10px}
.ligne-produit{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ligne-produit .mini{width:44px;height:44px;border-radius:8px;flex:none;background:var(--gold-soft);display:grid;place-items:center;overflow:hidden}
.ligne-produit .mini img{width:100%;height:100%;object-fit:cover}
.ligne-produit .mini svg{width:60%;height:60%;stroke:var(--gold);fill:none;stroke-width:1.6}
.ligne-produit .infos{flex:1;min-width:0}
.ligne-produit .infos strong{display:block;overflow-wrap:anywhere}
.ligne-produit .infos span{color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.marque-exemple{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--warn);border:1px solid currentColor;border-radius:999px;padding:1px 7px;margin-left:6px}
.editeur{background:var(--surface);border:1px solid var(--gold);border-radius:14px;padding:16px;margin-bottom:16px;display:grid;gap:14px}
.message{font-size:.9rem;padding:10px 12px;border-radius:10px;background:var(--gold-soft)}
.message.erreur{color:var(--danger)}
.champ input[type=color]{padding:3px;height:42px}
.sous-titre{font-family:var(--display);font-size:1.15rem;margin:22px 0 10px}
.confirmer{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}

@media (max-width:720px){
  .ouverture{grid-template-columns:1fr;padding-block:28px 16px}
  .grille{grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px}
  .contenu{padding:12px}
  .contenu h3{font-size:1.02rem}
}
@media (prefers-reduced-motion:no-preference){.ecrin{transition:transform .2s ease,box-shadow .2s ease}.ecrin:hover{transform:translateY(-2px);box-shadow:0 10px 24px -18px rgba(0,0,0,.35)}}
</style>
<script type="application/ld+json">{"@context": "https://schema.org", "@type": "JewelryStore", "name": "Kadya Jewels", "url": "https://kadyajewels.com/", "logo": "https://kadyajewels.com/logo.png", "telephone": "+224 620 56 27 71", "currenciesAccepted": "GNF", "sameAs": ["https://www.tiktok.com/@kadya.jewels"]}</script>

<body>
<div id="app"></div>

<template id="gabarit">
<header class="entete">
  <div class="enveloppe">
    <div class="marque">
      <span data-r="logo"></span>
      <div style="min-width:0">
        <h1 data-r="nom"></h1>
        <p data-r="slogan"></p>
      </div>
    </div>
    <button class="bouton-gestion" type="button" data-r="ouvrir-gestion" hidden>Gérer la boutique</button>
  </div>
</header>
<div class="photo-accueil" data-r="photo-accueil" hidden></div>
<div class="bandeau" data-r="bandeau" hidden><div class="enveloppe">Catalogue d'exemple : les produits et les prix réels de la boutique arrivent bientôt.</div></div>

<main class="enveloppe">
  <section class="ouverture">
    <div>
      <p class="etiquette" data-r="etiquette-accueil"></p>
      <h2 data-r="accroche"></h2>
      <p data-r="presentation"></p>
    </div>
    <div class="cours" data-r="cours" hidden>
      <span class="etiquette">Prix du gramme · or 18 carats</span>
      <strong data-r="cours-valeur"></strong>
      <small data-r="cours-date"></small>
    </div>
  </section>
  <nav class="filtres" aria-label="Catégories" data-r="filtres"></nav>
  <section class="grille" data-r="grille" aria-live="polite"></section>
</main>

<section class="contact">
  <div class="enveloppe">
    <div>
      <h2 data-r="titre-contact"></h2>
      <p class="pied" style="margin:8px 0 0" data-r="texte-contact"></p>
    </div>
    <dl data-r="coordonnees"></dl>
  </div>
</section>
<footer class="pied"><div class="enveloppe" data-r="pied"></div></footer>

<div class="gestion" data-r="gestion" hidden role="dialog" aria-modal="true" aria-labelledby="titre-gestion">
  <div class="enveloppe">
    <div class="barre-gestion">
      <h2 id="titre-gestion">Gérer la boutique</h2>
      <div class="actions">
        <button class="btn" type="button" data-r="fermer">Fermer sans enregistrer</button>
        <button class="btn principal" type="button" data-r="enregistrer">Enregistrer et publier</button>
      </div>
    </div>
    <div data-r="message-gestion"></div>
    <div class="onglets" role="tablist">
      <button class="onglet" type="button" role="tab" data-onglet="boutique" aria-selected="true">Boutique</button>
      <button class="onglet" type="button" role="tab" data-onglet="produits" aria-selected="false">Produits et prix</button>
    </div>

    <div data-panneau="boutique">
      <h3 class="sous-titre" style="margin-top:0">Identité et contact</h3>
      <div class="champs">
        <div class="champ"><label for="f-nom">Nom de la bijouterie</label><input id="f-nom" data-f="nom" maxlength="60"></div>
        <div class="champ"><label for="f-slogan">Slogan</label><input id="f-slogan" data-f="slogan" maxlength="80"></div>
        <div class="champ"><label for="f-whatsapp">Numéro WhatsApp</label><input id="f-whatsapp" data-f="whatsapp" inputmode="tel" placeholder="+224 6XX XX XX XX"><small>Avec l'indicatif du pays, par exemple +224 pour la Guinée.</small></div>
        <div class="champ"><label for="f-cours">Prix du gramme d'or 18 carats (GNF)</label><input id="f-cours" data-f="coursGramme" inputmode="numeric" placeholder="Laisser vide pour masquer"></div>
        <div class="champ"><label for="f-tiktok">Compte TikTok</label><input id="f-tiktok" data-f="tiktok" placeholder="Ex. : kadya.jewels"></div>
        <div class="champ"><label for="f-adresse">Adresse ou quartier</label><input id="f-adresse" data-f="adresse" placeholder="Ex. : Madina, Conakry"></div>
        <div class="champ"><label for="f-horaires">Horaires</label><input id="f-horaires" data-f="horaires" placeholder="Ex. : lun.–sam., 9 h – 19 h"></div>
        <div class="champ"><label for="f-facebook">Page Facebook (lien)</label><input id="f-facebook" data-f="facebook" placeholder="https://facebook.com/…"></div>
        <div class="champ"><label for="f-instagram">Compte Instagram</label><input id="f-instagram" data-f="instagram" placeholder="Ex. : kadya.jewels"></div>
      </div>
      <h3 class="sous-titre">Textes de la page</h3>
      <div class="champs">
        <div class="champ large"><label for="f-etiquette">Petit texte au-dessus du titre</label><input id="f-etiquette" data-f="etiquetteAccueil" maxlength="60"></div>
        <div class="champ large"><label for="f-accroche">Titre de la page d'accueil</label><input id="f-accroche" data-f="accroche" maxlength="90"></div>
        <div class="champ large"><label for="f-presentation">Présentation</label><textarea id="f-presentation" data-f="presentation" rows="3" maxlength="400"></textarea></div>
        <div class="champ"><label for="f-titre-contact">Titre de la section contact</label><input id="f-titre-contact" data-f="titreContact" maxlength="70"></div>
        <div class="champ"><label for="f-texte-contact">Texte de la section contact</label><input id="f-texte-contact" data-f="texteContact" maxlength="200"></div>
        <div class="champ large"><label for="f-categories">Catégories de bijoux</label><input id="f-categories" data-f="categories"><small>Séparées par des virgules, dans l'ordre d'affichage. Ex. : Bagues, Colliers, Montres</small></div>
      </div>
      <h3 class="sous-titre">Images et couleurs</h3>
      <div class="champs">
        <div class="champ"><label for="f-couleur">Couleur principale</label><input id="f-couleur" type="color" data-f="couleurMarque"><small>Bandeau du haut et boutons.</small></div>
        <div class="champ"><label for="f-couleur-or">Couleur secondaire</label><input id="f-couleur-or" type="color" data-f="couleurOr"><small>Slogan et détails dans le bandeau.</small></div>
        <div class="champ large">
          <label for="f-accueil">Grande photo d'accueil (facultatif)</label>
          <div class="ligne-logo">
            <span data-r="apercu-accueil"></span>
            <input id="f-accueil" type="file" accept="image/*" data-r="fichier-accueil">
            <button class="btn" type="button" data-r="retirer-accueil">Retirer la photo</button>
          </div>
          <small>Une photo large de la boutique ou d'une parure, affichée sous le bandeau.</small>
        </div>
        <div class="champ large">
          <label for="f-logo">Logo</label>
          <div class="ligne-logo">
            <span class="apercu-logo" data-r="apercu-logo"></span>
            <input id="f-logo" type="file" accept="image/*" data-r="fichier-logo">
            <button class="btn" type="button" data-r="retirer-logo">Retirer le logo</button>
          </div>
          <small data-r="aide-logo">Image carrée de préférence. Sans logo, l'initiale du nom s'affiche.</small>
        </div>
      </div>
    </div>

    <div data-panneau="produits" hidden>
      <div class="actions" style="margin-bottom:14px">
        <button class="btn principal" type="button" data-r="ajouter">Ajouter un bijou</button>
        <button class="btn" type="button" data-r="vider-exemples">Supprimer tous les exemples</button>
      </div>
      <div data-r="zone-editeur"></div>
      <div class="liste-produits" data-r="liste"></div>
    </div>
  </div>

    var presentes = ordre.filter(function(c){ return etat.produits.some(function(p){ return p.categorie === c; }); });
    if (filtre !== "Tous" && presentes.indexOf(filtre) < 0) filtre = "Tous";
    $("filtres").innerHTML = ["Tous"].concat(presentes).map(function(c){
      return '<button type="button" class="filtre" data-cat="' + esc(c) + '" aria-pressed="' + (c === filtre) + '">' + esc(c) + '</button>';
    }).join("");

    var liste = etat.produits.filter(function(p){ return filtre === "Tous" || p.categorie === filtre; });
    var num = chiffres(etat.whatsapp);
    $("grille").innerHTML = liste.length ? liste.map(function(p){
      var lien = lienWhatsApp(p);
      var bouton = !p.dispo ? '<span class="commander" aria-disabled="true">Bientôt de retour</span>'
        : lien ? '<a class="commander" href="' + esc(lien) + '" target="_blank" rel="noopener">Commander sur WhatsApp</a>'
        : '<span class="commander" aria-disabled="true">Commande WhatsApp bientôt</span>';
      return '<article class="ecrin"><div class="visuel"><span class="pastille">' + esc(p.categorie) + '</span>' + visuel(p) + '</div>' +
        '<div class="contenu"><h3>' + esc(p.nom) + '</h3>' +
        '<div class="details">' + esc([p.metal, grammes(p.poids)].filter(Boolean).join(" · ")) + '</div>' +
        (p.description ? '<div class="details">' + esc(p.description) + '</div>' : '') +
        '<div class="prix' + (p.dispo ? '' : ' epuise') + '">' + (p.dispo ? gnf(p.prix) : 'Épuisé') + '</div>' + bouton + '</div></article>';
    }).join("") : '<p class="vide">Aucun bijou dans cette catégorie pour le moment.</p>';

    var lignes = [];
    if (num) lignes.push('<div><dt>WhatsApp</dt><dd>' + esc(etat.whatsapp) + '</dd></div>');
    var tk = String(etat.tiktok || "").replace(/^@/, "").trim();
    if (tk) lignes.push('<div><dt>TikTok</dt><dd><a href="https://www.tiktok.com/@' + encodeURIComponent(tk) + '" target="_blank" rel="noopener">@' + esc(tk) + '</a></dd></div>');
    var ig = String(etat.instagram || "").replace(/^@/, "").trim();
    if (ig) lignes.push('<div><dt>Instagram</dt><dd><a href="https://www.instagram.com/' + encodeURIComponent(ig) + '" target="_blank" rel="noopener">@' + esc(ig) + '</a></dd></div>');
    if (/^https?:\/\//i.test(etat.facebook || "")) lignes.push('<div><dt>Facebook</dt><dd><a href="' + esc(etat.facebook) + '" target="_blank" rel="noopener">Notre page Facebook</a></dd></div>');
    if (etat.adresse) lignes.push('<div><dt>Adresse</dt><dd>' + esc(etat.adresse) + '</dd></div>');
    if (etat.horaires) lignes.push('<div><dt>Horaires</dt><dd>' + esc(etat.horaires) + '</dd></div>');
    if (!lignes.length) lignes.push('<div><dt>Coordonnées</dt><dd>Les coordonnées de la boutique seront bientôt affichées.</dd></div>');
    $("coordonnees").innerHTML = lignes.join("");
    $("pied").textContent = (etat.nom || "Bijouterie") + " · Prix en francs guinéens (GNF), à confirmer au moment de la commande.";
  }

  app.addEventListener("click", function(e){
    var b = e.target.closest(".filtre");
    if (b) { filtre = b.getAttribute("data-cat"); rendreVitrine(); }
  });

  /* ---------- Gestion ---------- */
  function copie(o){ return JSON.parse(JSON.stringify(o)); }
  function message(txt, erreur){ $("message-gestion").innerHTML = txt ? '<p class="message' + (erreur ? ' erreur' : '') + '">' + esc(txt) + '</p>' : ""; }

  function ouvrirGestion(){
    brouillon = copie(etat); enEdition = null; enSuppression = null;
    app.querySelectorAll("[data-f]").forEach(function(inp){
      var k = inp.getAttribute("data-f"), v = brouillon[k];
      if (k === "categories") v = cats(brouillon).join(", ");
      if (inp.type === "color") v = couleurValide(v) ? v : (k === "couleurOr" ? "#FFBE5C" : "#600B09");
      inp.value = v == null ? "" : v;
    });
    message("");
    afficherOnglet(ongletActif);
    rendreGestion();
    $("gestion").hidden = false;
    document.body.style.overflow = "hidden";
  }
  function fermerGestion(){ $("gestion").hidden = true; document.body.style.overflow = ""; brouillon = null; }

  function afficherOnglet(nom){
    ongletActif = nom;
    app.querySelectorAll("[data-onglet]").forEach(function(o){ o.setAttribute("aria-selected", String(o.getAttribute("data-onglet") === nom)); });
    app.querySelectorAll("[data-panneau]").forEach(function(p){ p.hidden = p.getAttribute("data-panneau") !== nom; });
  }

  function rendreGestion(){
    $("apercu-logo").innerHTML = blocLogo(brouillon.logo, brouillon.nom);
    $("retirer-logo").hidden = !brouillon.logo;
    $("apercu-accueil").innerHTML = brouillon.photoAccueil ? '<img alt="" src="' + esc(brouillon.photoAccueil) + '" style="width:120px;height:60px;object-fit:cover;border-radius:8px;display:block">' : "";
    $("retirer-accueil").hidden = !brouillon.photoAccueil;
    $("fichier-accueil").disabled = !assets;
    $("fichier-logo").disabled = !assets;
    if (!assets) $("aide-logo").textContent = "L'envoi d'images n'est pas disponible dans cette vue.";
    $("vider-exemples").hidden = !brouillon.produits.some(function(p){ return p.exemple; });
    $("liste").innerHTML = brouillon.produits.length ? brouillon.produits.map(function(p){
      var conf = enSuppression === p.id ? '<div class="confirmer">Supprimer ce bijou ? <button class="btn danger" type="button" data-act="oui-suppr" data-id="' + p.id + '">Oui, supprimer</button><button class="btn" type="button" data-act="non-suppr">Annuler</button></div>' : '';
      return '<div class="ligne-produit"><div class="mini">' + (p.photo ? '<img alt="" src="' + esc(p.photo) + '">' : (ICONES[p.categorie] || ICONES.Autres)) + '</div>' +
        '<div class="infos"><strong>' + esc(p.nom) + (p.exemple ? '<span class="marque-exemple">exemple</span>' : '') + '</strong>' +
        '<span>' + esc(p.categorie) + ' · ' + (p.dispo ? gnf(p.prix) : 'Épuisé') + '</span>' + conf + '</div>' +
        '<div class="actions"><button class="btn" type="button" data-act="monter" data-id="' + p.id + '" aria-label="Monter">↑</button><button class="btn" type="button" data-act="descendre" data-id="' + p.id + '" aria-label="Descendre">↓</button><button class="btn" type="button" data-act="modifier" data-id="' + p.id + '">Modifier</button>' +
        '<button class="btn danger" type="button" data-act="supprimer" data-id="' + p.id + '">Supprimer</button></div></div>';
    }).join("") : '<p class="vide">Aucun bijou. Appuyez sur « Ajouter un bijou » pour commencer.</p>';
    rendreEditeur();
  }

  function rendreEditeur(){
    var zone = $("zone-editeur");
    if (!enEdition) { zone.innerHTML = ""; return; }
    var p = enEdition;
    zone.innerHTML = '<div class="editeur"><h3>' + (p.nouveau ? "Nouveau bijou" : "Modifier le bijou") + '</h3><div class="champs">' +
      '<div class="champ"><label for="e-nom">Nom du bijou</label><input id="e-nom" data-e="nom" value="' + esc(p.nom) + '" maxlength="70"></div>' +
      '<div class="champ"><label for="e-cat">Catégorie</label><select id="e-cat" data-e="categorie">' + (function(){ var l = cats(brouillon).slice(); if (p.categorie && l.indexOf(p.categorie) < 0) l.push(p.categorie); return l; })().map(function(c){ return '<option' + (c === p.categorie ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join("") + '</select></div>' +
      '<div class="champ"><label for="e-metal">Métal et titrage</label><input id="e-metal" data-e="metal" value="' + esc(p.metal) + '" placeholder="Ex. : Or 18 carats"></div>' +
      '<div class="champ"><label for="e-poids">Poids (g)</label><input id="e-poids" data-e="poids" inputmode="decimal" value="' + esc(p.poids ? String(p.poids).replace(".", ",") : "") + '"></div>' +
      '<div class="champ"><label for="e-prix">Prix (GNF)</label><input id="e-prix" data-e="prix" inputmode="numeric" value="' + esc(p.prix || "") + '"><small data-r="suggestion"></small></div>' +
      '<div class="champ"><label for="e-dispo">Disponibilité</label><select id="e-dispo" data-e="dispo"><option value="1"' + (p.dispo ? ' selected' : '') + '>En stock</option><option value="0"' + (p.dispo ? '' : ' selected') + '>Épuisé</option></select></div>' +
      '<div class="champ large"><label for="e-desc">Description (facultatif)</label><input id="e-desc" data-e="description" value="' + esc(p.description) + '" maxlength="160"></div>' +
      '<div class="champ large"><label for="e-photo">Photo</label><div class="ligne-logo"><div class="mini" style="width:56px;height:56px;border-radius:10px;overflow:hidden;background:var(--gold-soft);display:grid;place-items:center">' + (p.photo ? '<img alt="" src="' + esc(p.photo) + '" style="width:100%;height:100%;object-fit:cover">' : '') + '</div>' +
      '<input id="e-photo" type="file" accept="image/*" data-r="fichier-photo"' + (assets ? '' : ' disabled') + '>' + (p.photo ? '<button class="btn" type="button" data-act="retirer-photo">Retirer la photo</button>' : '') + '</div></div>' +
      '</div><div class="actions"><button class="btn principal" type="button" data-act="valider">Valider ce bijou</button><button class="btn" type="button" data-act="annuler">Annuler</button></div>' +
      '<p class="details" style="margin:0">« Valider » met à jour la liste ; pensez ensuite à « Enregistrer et publier ».</p></div>';
    majSuggestion();
  }

  function lireEditeur(){
    $("zone-editeur").querySelectorAll("[data-e]").forEach(function(i){
      var k = i.getAttribute("data-e"), v = i.value;
      if (k === "poids") v = parseFloat(String(v).replace(",", ".")) || 0;
      else if (k === "prix") v = Number(chiffres(v)) || 0;
      else if (k === "dispo") v = v === "1";
      else v = v.trim();
      enEdition[k] = v;
    });
  }
  function majSuggestion(){
    var s = $("suggestion"); if (!s) return;
    var poids = parseFloat(String(($("zone-editeur").querySelector('[data-e="poids"]') || {}).value || "").replace(",", "."));
    var cours = Number(chiffres(app.querySelector('[data-f="coursGramme"]').value));
    s.textContent = poids && cours ? "Au prix du gramme : " + gnf(poids * cours) : "";
  }

  function nouvelId(){ return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  async function envoyerImage(fichier){
    if (!assets) throw new Error("indisponible");
    var r = await assets.upload(fichier);
    return "/_blob/" + r.id;
  }

  app.addEventListener("click", async function(e){
    var t = e.target.closest("[data-r],[data-act],[data-onglet]");
    if (!t || !brouillon && t.getAttribute("data-r") !== "ouvrir-gestion") return;
    var r = t.getAttribute("data-r"), act = t.getAttribute("data-act"), ong = t.getAttribute("data-onglet");
    if (r === "ouvrir-gestion") return ouvrirGestion();
    if (r === "fermer") return fermerGestion();
    if (r === "enregistrer") return enregistrer();
    if (ong) return afficherOnglet(ong);
    if (r === "retirer-logo") { brouillon.logo = ""; return rendreGestion(); }
    if (r === "retirer-accueil") { brouillon.photoAccueil = ""; return rendreGestion(); }
    if (r === "ajouter") { enEdition = {id: nouvelId(), nom: "", categorie: cats(brouillon)[0], metal: "Or 18 carats", poids: 0, prix: 0, description: "", photo: "", dispo: true, nouveau: true}; return rendreEditeur(); }
    if (r === "vider-exemples") { brouillon.produits = brouillon.produits.filter(function(p){ return !p.exemple; }); return rendreGestion(); }
    var id = t.getAttribute("data-id");
    if (act === "modifier") { enEdition = copie(brouillon.produits.find(function(p){ return p.id === id; })); rendreEditeur(); $("zone-editeur").scrollIntoView({block: "start"}); return; }
    if (act === "monter" || act === "descendre") {
      var k = brouillon.produits.findIndex(function(x){ return x.id === id; }), j = k + (act === "monter" ? -1 : 1);
      if (k >= 0 && j >= 0 && j < brouillon.produits.length) { var tmp = brouillon.produits[k]; brouillon.produits[k] = brouillon.produits[j]; brouillon.produits[j] = tmp; }
      return rendreGestion();
    }
    if (act === "supprimer") { enSuppression = id; return rendreGestion(); }
    if (act === "non-suppr") { enSuppression = null; return rendreGestion(); }
    if (act === "oui-suppr") { brouillon.produits = brouillon.produits.filter(function(p){ return p.id !== id; }); enSuppression = null; return rendreGestion(); }
    if (act === "annuler") { enEdition = null; return rendreEditeur(); }
    if (act === "retirer-photo") { lireEditeur(); enEdition.photo = ""; return rendreEditeur(); }
    if (act === "valider") {
      lireEditeur();
      if (!enEdition.nom) { message("Donnez un nom au bijou avant de le valider.", true); return; }
      if (enEdition.dispo && !enEdition.prix) { message("Indiquez le prix en francs guinéens, ou choisissez « Épuisé ».", true); return; }
      var p = copie(enEdition); delete p.nouveau; p.exemple = false;
      var i = brouillon.produits.findIndex(function(x){ return x.id === p.id; });
      if (i >= 0) brouillon.produits[i] = p; else brouillon.produits.unshift(p);
      enEdition = null; message("Bijou validé. Appuyez sur « Enregistrer et publier » pour le mettre en ligne.");
      return rendreGestion();
    }
  });

  app.addEventListener("input", function(e){
    var f = e.target.getAttribute && e.target.getAttribute("data-f");
    if (f === "categories" && brouillon) { brouillon.categories = e.target.value.split(",").map(function(x){ return x.trim(); }).filter(Boolean); return; }
    if (f && brouillon) { brouillon[f] = e.target.value; if (f === "nom") $("apercu-logo").innerHTML = blocLogo(brouillon.logo, brouillon.nom); }
    if (e.target.matches && e.target.matches('[data-e="poids"],[data-f="coursGramme"]')) majSuggestion();
  });

  app.addEventListener("change", async function(e){
    var r = e.target.getAttribute && e.target.getAttribute("data-r");
    if (r !== "fichier-logo" && r !== "fichier-photo" && r !== "fichier-accueil") return;
    var f = e.target.files && e.target.files[0]; if (!f) return;
    if (!/^image\//.test(f.type)) { message("Choisissez une image (JPG, PNG ou WebP).", true); return; }
    if (f.size > 20 * 1024 * 1024) { message("Cette image dépasse 20 Mo. Choisissez une image plus légère.", true); return; }
    message("Envoi de l'image…");
    try {
      var url = await envoyerImage(f);
      if (r === "fichier-logo") { brouillon.logo = url; rendreGestion(); }
      else if (r === "fichier-accueil") { brouillon.photoAccueil = url; rendreGestion(); }
      else { lireEditeur(); enEdition.photo = url; rendreEditeur(); }
      message("Image ajoutée. Pensez à « Enregistrer et publier ».");
    } catch (err) {
      message("L'image n'a pas pu être envoyée. Réessayez avec une image plus petite.", true);
    }
  });

  function nettoyer(b){
    var s = copie(b);
    ["nom","slogan","accroche","presentation","whatsapp","adresse","horaires","tiktok","instagram","facebook","etiquetteAccueil","titreContact","texteContact"].forEach(function(k){ s[k] = String(s[k] || "").trim(); });
    s.instagram = s.instagram.replace(/^@/, "").replace(/^https?:\/\/(www\.)?instagram\.com\//i, "").replace(/\/.*$/, "");
    if (s.facebook && !/^https?:\/\//i.test(s.facebook)) s.facebook = "https://" + s.facebook;
    s.tiktok = s.tiktok.replace(/^@/, "").replace(/^https?:\/\/(www\.)?tiktok\.com\/@?/i, "").replace(/\/.*$/, "");
    var c = Number(chiffres(s.coursGramme)) || 0;
    if (c !== Number(etat.coursGramme)) {
      var d = new Date(); s.coursDate = c ? d.toLocaleDateString("fr-FR", {day: "numeric", month: "long", year: "numeric"}) : "";
    }
    s.coursGramme = c;
    return s;
  }

  function documentComplet(s){
    var json = JSON.stringify(s).replace(/</g, "\\u003c");
    var fin = "</" + "script>";
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + RESET + '</style></head><body>' +
      '<title>' + esc(s.nom || "Bijouterie") + '</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n' + POLICES + '\n' +
      '<style id="css">' + document.getElementById("css").textContent + '</style>\n\n<div id="app"></div>\n\n' +
      '<template id="gabarit">' + document.getElementById("gabarit").innerHTML + '</template>\n\n' +
      '<script type="application/json" id="donnees">' + json + fin + '\n\n<script id="appli">' + SOURCE + fin + '\n';
  }

  async function enregistrer(){
    if (enEdition) { message("Validez ou annulez le bijou en cours de modification avant d'enregistrer.", true); return; }
    if (!artifact) { message("L'enregistrement n'est pas disponible dans cette vue.", true); return; }
    var s = nettoyer(brouillon);
    if (s.whatsapp && chiffres(s.whatsapp).length < 8) { message("Le numéro WhatsApp semble incomplet. Indiquez-le avec l'indicatif, par exemple +224 6XX XX XX XX.", true); afficherOnglet("boutique"); return; }
    var btn = $("enregistrer"); btn.disabled = true; btn.textContent = "Publication…";
    try {
      await artifact.publish(documentComplet(s));
      message("Publié. La page se recharge avec vos changements.");
    } catch (err) {
      btn.disabled = false; btn.textContent = "Enregistrer et publier";
      var code = err && err.code;
      if (code === "conflict") message("Quelqu'un d'autre vient de publier une modification : la page se recharge avec sa version.", true);
      else if (code === "not_writer" || code === "not_granted") { message("Vous pouvez consulter la boutique, mais pas la modifier.", true); $("ouvrir-gestion").hidden = true; }
      else if (code === "too_large") message("La page est trop lourde. Retirez quelques photos et réessayez.", true);
      else if (code === "rate_limited") message("Trop d'enregistrements rapprochés. Patientez une minute puis réessayez.", true);
      else message("La publication a échoué. Réessayez dans un instant.", true);
    }
  }


  rendreVitrine();

  (async function(){
    if (!window.claude || !window.claude.use) return;
    try {
      var res = await Promise.all([claude.use("artifact"), claude.use("user"), claude.use("assets")]);
      artifact = res[0]; assets = res[2];
      var u = res[1];
      peutModifier = !!artifact && !!u && (await u.canEdit());
      $("ouvrir-gestion").hidden = !peutModifier;
    } catch (e) { /* vitrine seule */ }
  })();
})();
</script>
</body>
</html>
